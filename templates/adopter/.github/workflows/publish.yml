name: publish

# The repo-cut release ladder (the family shape, receipt dhaupin/eyestruct@4e2b552).
# A tag drives the whole ladder end-to-end: nothing is earned by a green
# publish step alone, because a publish CAN go green while the registry result
# is wrong - nothing asserted the tarball in between.
#
#   1. publish  - npm Trusted Publishing (OIDC): NO publish token exists
#                 anywhere. npm >= 11.5.1 floor installed in-lane. The battery
#                 rides automatically (npm publish runs prepublishOnly); the
#                 gate refuses 0.x and, on a tag push, a tag that disagrees
#                 with the packaged version.
#   2. release  - the GH release object is cut from the tag, its notes
#                 extracted from the CHANGELOG's own [version] section. The
#                 EXACT served tarball is attached (polled, since the registry
#                 read replica lags), so the release asset and the npm artifact
#                 are the same bytes.
#   3. verify   - the post-publish truth, run from the INSTALLED coreforge
#                 package (`npx --no-install coreforge verify-release`): the
#                 registry latest == this version, the served tarball's sha512
#                 == the registry integrity, provenance present, and the GH
#                 release targets the tag's commit.
#
# This lane is stamped by `coreforge create` and is YOURS to edit. It needs a
# package.json (the version truth) and a prepublishOnly/`test` script - the
# stamped package.json ships both, plus `prepublishOnly` (the battery that
# rides every publish).
#
# A stamped site is `"private": true` (a website is not an npm library, so the
# registry cut is OFF until you ask for it). To publish: remove `"private"`,
# set a scoped/owned `name`, and link the package to this repo under
# npmjs.com -> package Settings -> Publishing access (the OIDC flow needs that
# mapping). No secret is ever created.
#
# Adapt `on.push.tags` and the verify step's flags to your shape.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish = registry cut | verify-only = re-run the trust ladder against what is already served'
        required: false
        default: 'publish'
        type: choice
        options: ['publish', 'verify-only']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push' || inputs.mode != 'verify-only'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: npm floor for trusted publishing (11.5.1+)
        run: npm install -g npm@^11

      - id: gate
        name: the gate - 0.x refused, tag == packaged version
        env:
          TAG_REF: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          V="$(node -p "require('./package.json').version")"
          case "$V" in
            0.*) echo "publish gate: refusing $V - the OIDC lane serves 1.0.0+ only (0.x is the manual ship lane)"; exit 1 ;;
          esac
          REF="$TAG_REF"
          EVENT="$EVENT_NAME"
          if [ "$EVENT" = "push" ] && [ "$REF" != "v$V" ]; then
            echo "publish gate: refusing - tag $REF does not equal the packaged version v$V"; exit 1
          fi
          TAG="v$V"
          echo "publish gate: $TAG passes the 0.x refusal and the tag==version gate"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install (hermetic when a lockfile ships)
        run: |
          if [ -f package-lock.json ]; then npm ci --no-fund --no-audit
          else npm install --no-fund --no-audit; fi

      - name: npm publish (OIDC - no token secret; skip if the registry already has this version)
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          REMOTE=$(npm view "$NAME@$LOCAL" version 2>/dev/null || true)
          if [ "$REMOTE" = "$LOCAL" ]; then
            echo "$NAME@$LOCAL already on the registry -- skipping publish"
          else
            npm publish --provenance
          fi

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      # `coreforge release-notes` is the installed tool (the same package the
      # publish job installed), so this job installs it too.
      - name: Install (hermetic when a lockfile ships)
        run: |
          if [ -f package-lock.json ]; then npm ci --no-fund --no-audit
          else npm install --no-fund --no-audit; fi
      - name: extract the release notes from the changelog (refuses empty)
        env:
          BLOCK_VERSION: ${{ needs.publish.outputs.version }}
        run: npx --no-install coreforge release-notes "$BLOCK_VERSION" > "$RUNNER_TEMP/notes.md"
      - name: cut the GH release from the tag (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCK_VERSION: ${{ needs.publish.outputs.version }}
          BLOCK_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          TAG="$BLOCK_TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists - not re-minting; the verify job judges its truth"
          else
            gh release create "$TAG" --title "__NAME__ $BLOCK_VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: attach the served tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCK_VERSION: ${{ needs.publish.outputs.version }}
          BLOCK_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -e
          NAME=$(node -p "require('./package.json').name")
          # The EXACT tarball the registry serves - not a re-pack of the
          # checkout, so the release asset and the npm artifact never drift.
          # Poll (bounded): the registry read replica lags the publish.
          for i in $(seq 1 60); do
            if npm pack "$NAME@$BLOCK_VERSION" --pack-destination "$RUNNER_TEMP" > /dev/null 2>&1; then break; fi
            if [ "$i" = "60" ]; then echo "the registry never served $NAME@$BLOCK_VERSION (60 attempts)"; exit 1; fi
            echo "waiting for $NAME@$BLOCK_VERSION on the registry (attempt $i/60)"; sleep 5
          done
          gh release upload "$BLOCK_TAG" "$RUNNER_TEMP/$NAME-$BLOCK_VERSION.tgz" --clobber

  # The verify leg judges what the registry and GitHub actually serve, so it
  # must wait for release to cut the object and attach the tarball - a bare
  # `needs: publish` let verify race release and red-flag a cut that landed
  # (the packstruct 1.1.0 first run). It ALSO stands alone in verify-only mode
  # (publish skipped, release skipped, the ladder judged against what is
  # already served and released).
  verify:
    needs: [publish, release]
    if: >-
      always() &&
      (needs.publish.result == 'success' ||
       (needs.publish.result == 'skipped' && inputs.mode == 'verify-only'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - name: the post-publish trust ladder (npm + GH release)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          V="$(node -p "require('./package.json').version")"
          NAME=$(node -p "require('./package.json').name")
          # This is a SITE, not a library: the tarball legitimately carries the
          # built site halves. An adopter narrows --allow to its own shape; the
          # family defaults still refuse source maps, .env*, and node_modules.
          ALLOW="web/,docs/,.github/"
          npx --no-install coreforge verify-release --npm --version "$V" --allow "$ALLOW"
          npx --no-install coreforge verify-release --gh --tag "v$V" --asset "$NAME-$V.tgz"
