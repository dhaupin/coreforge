name: test

# The stamped site's battery: the gates run against YOUR tree (the same gates
# coreforge runs on itself), plus the two engine builds. This lane is stamped
# by `coreforge create` and is yours to edit; the gates it calls live in the
# installed `coreforge` package, so a gate fix reaches you through
# `npm update coreforge`, not a re-copy.
#
# Family tool slots (the same posture coreforge's own battery carries:
# empty = vacuous green, never false-red; a slot wakes the day its input
# exists):
#   packstruct - WIRED. Manifest lint over YOUR packs/ (the `packs/` slot the
#     shell ships). An empty tree is "0 packs checked", exit 0; the first
#     pack.json you drop in is gated from its first commit.
#   crashtest  - WIRED-WHEN-READY. `crashtest run` without a config is a hard
#     exit 2, so the step arm-gates on crashtest.config.js existing. Add a
#     config (your routes/adapters) and the campaign wakes on its own.
#   poststruct - TBA. A post-build SEO check-profile host; wake it when you
#     want your built dist/ graded, beside the pinned tool rows.
#   eyestruct  - WIRED-WHEN-READY. Visual regression needs committed baselines
#     (labs/.eyes/), so the step arm-gates on the manifest's existence.
#     `eyestruct gate` is a browserless read-only pass over labs/.eyes/ (exit 1
#     on unexplained drift) - no chrome, no network. Seed the home once with
#     `eyestruct init`; canon is CI-cut by eyestruct's own ratify lane (a push
#     battery proposes, it never cuts canon).
#   govstruct  - n/a for a plain site (registry/compliance); it governs the
#     FAMILY roster, not an individual stamped site.
#
# Pins are EXACT (a moving `latest` is a supply-chain hole). A bump moves the
# pin here in the same commit that justifies it.

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      # The gates over YOUR tree: brand census, docs frontmatter/links/style/
      # fiction/liquid, theme parity, language. `coreforge check` resolves your
      # site root by walking up to site.config.js.
      - name: Gates (coreforge check)
        run: npx --no-install coreforge check

      # The derived surfaces must be current: docs/_config.yml,
      # docs/freestruct.config.yml, web/ssr.config.js, robots.txt,
      # site.webmanifest. `--check` refuses drift (run `coreforge sync` locally).
      - name: Derived surfaces are current (coreforge sync --check)
        run: npx --no-install coreforge sync --check

      # packstruct manifest lint over YOUR packs/ (the shell's slot), through
      # coreforge's own wrapper verb (`coreforge lint-packs`): it resolves the
      # repo's own install, defaults to the packs ROOT, and names the exact
      # fix if packstruct is missing. Empty tree is a clean pass; the first
      # pack.json is gated from its first commit.
      - name: Install packstruct (pinned)
        run: npm install --no-save --no-audit --no-fund packstruct@1.0.0

      - name: packstruct lint packs/
        run: npm run lint:packs

      # crashtest: armed, but wakes only when YOUR site has a target. `crashtest
      # run` with no crashtest.config.js is a hard exit 2 (missing config = "the
      # run is wrong", never a pass), so the arm gate is the config's existence.
      - name: Install crashtest (pinned, parked until the config lands)
        if: ${{ hashFiles('crashtest.config.js') != '' }}
        run: npm install --no-save --no-audit --no-fund crashtest@1.1.0

      - name: Crashtest the site
        if: ${{ hashFiles('crashtest.config.js') != '' }}
        run: node node_modules/crashtest/bin/crashtest.js run

      # eyestruct: armed, but wakes only when you have committed a visual home
      # (labs/.eyes/). `eyestruct gate` is a browserless read-only pass - it
      # needs no chrome and no network, so it is safe to run in CI the moment a
      # manifest exists. Canon is CI-cut (eyestruct's own ratify lane); this
      # battery only refuses unexplained drift.
      - name: Install eyestruct (pinned, parked until labs/.eyes lands)
        if: ${{ hashFiles('labs/.eyes/manifest.yml') != '' }}
        run: npm install --no-save --no-audit --no-fund eyestruct@1.1.0

      - name: Eyestruct gate (visual memory)
        if: ${{ hashFiles('labs/.eyes/manifest.yml') != '' }}
        run: node node_modules/eyestruct/bin/eyestruct.js gate

      - name: Install web deps
        run: npm install --prefix web --no-audit --no-fund

      - name: Web build (prestruct prerender)
        run: npm run build --prefix web

      - name: Setup Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: './docs'

      - name: Docs build (Jekyll)
        run: cd docs && bundle exec jekyll build
        env:
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
